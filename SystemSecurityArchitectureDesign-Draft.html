<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>System Security Architecture Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one SABSA form (six layers x six questions) with a sticky Generate bar; outputs are full-width design documents. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --sunk:#e9edf1; --line:#d5dce3; --fg:#18222d; --muted:#5b6876;
  --accent:#1f4f8a; --accent-ink:#ffffff; --accent-soft:#e3ecf7;
  --ok:#1d7a4c; --ok-soft:#e1f2e8; --warn:#a86a00; --warn-soft:#fbf0d9; --crit:#b42828; --crit-soft:#f8e1e1; --na:#8a96a3;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
/* Light is the default, whatever the device setting. Dark applies only when the viewer picks the dark theme in Claude. */
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#161f29; --sunk:#1c2733; --line:#2b3846; --fg:#e3e9ef; --muted:#93a1b0;
  --accent:#7fb0ec; --accent-ink:#0d1620; --accent-soft:#1b2c42;
  --ok:#5cc58e; --ok-soft:#173326; --warn:#e2ad4a; --warn-soft:#352a14; --crit:#f07c7c; --crit-soft:#3a1c1e; --na:#6f7c8a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.wrap{padding-inline:16px;max-width:1320px;margin:0 auto}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:12px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.syspick{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 260px}
.syspick select{min-width:0;flex:0 1 340px;border:1px solid var(--line);background:var(--sunk);border-radius:var(--r);padding:5px 8px;font-weight:600}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kpi b{font-family:var(--f-mono);color:var(--fg);font-size:13px}
.kpi.c b{color:var(--crit)} .kpi.h b{color:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--fg)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--sunk);border-radius:999px;padding:1px 6px;margin-left:4px}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-top:16px;font-size:13px}
.banner.warn{background:var(--warn-soft)}
.banner.err{background:var(--crit-soft)}
.banner p{margin:0;flex:1 1 300px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:9px 18px;font-size:14px}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
main{padding-block:16px 48px}

/* form */
.assess{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:flex;flex-direction:column;gap:2px}
.rail .eyebrow{padding:0 10px 6px}
.rail button{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:var(--r);padding:7px 10px;cursor:pointer;color:var(--fg)}
.rail button:hover{background:var(--sunk)}
.rail .nm{flex:1;min-width:0}
.rail .nm small{display:block;color:var(--muted);font-size:11.5px}
.rail .prog{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--na)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.layers{display:flex;flex-direction:column;gap:20px;min-width:0}
.sect{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;scroll-margin-top:124px}
.sect-h{padding:18px 20px 14px;border-bottom:2px solid var(--fg)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sect-h h2{font-size:23px;margin-top:2px}
.sect-h p{margin:6px 0 0;color:var(--muted);max-width:80ch}
.cell-h{display:flex;gap:10px;align-items:baseline;padding:10px 20px;background:var(--sunk);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.cell-h:first-of-type{border-top:0}
.cell-h .qw{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);min-width:52px}
.cell-h h3{font-size:15px}
.cell-h span.d{color:var(--muted);font-size:12.5px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;padding:13px 20px;border-bottom:1px solid var(--line);align-items:start}
.q:last-child{border-bottom:0}
.q.st-gap{box-shadow:inset 3px 0 0 var(--crit)} .q.st-partial{box-shadow:inset 3px 0 0 var(--warn)} .q.st-met{box-shadow:inset 3px 0 0 var(--ok)}
.q.miss{background:var(--crit-soft)}
.q .lab{font-weight:500}
.q .lab .rq{color:var(--crit)}
.q .help{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:70ch}
.refs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ref{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.ref.sev-C{border-color:var(--crit);color:var(--crit)} .ref.sev-H{border-color:var(--warn);color:var(--warn)}
.ref.ba{border-style:dashed}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:440px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 11px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--sunk)}
.seg button[aria-pressed="true"][data-s="met"]{background:var(--ok-soft);color:var(--ok);font-weight:600}
.seg button[aria-pressed="true"][data-s="partial"]{background:var(--warn-soft);color:var(--warn);font-weight:600}
.seg button[aria-pressed="true"][data-s="gap"]{background:var(--crit-soft);color:var(--crit);font-weight:600}
.seg button[aria-pressed="true"][data-s="na"],.seg button[aria-pressed="true"][data-s="info"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.multi{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.multi button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.multi button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:5px 8px;min-width:0;width:280px;max-width:100%}
.inp.sm{font-size:12.5px}
.blk{padding:14px 20px;border-bottom:1px solid var(--line)}
.blk h4{font-size:14.5px}
.blk .help{color:var(--muted);font-size:12.5px;margin:2px 0 10px;max-width:80ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.submitbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:5;display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--r);padding:12px 16px;box-shadow:0 -6px 18px -12px rgba(0,0,0,.35)}
.submitbar .pg{flex:1 1 220px;min-width:0;font-size:13px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;font-size:12.5px;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.et td{padding:4px 5px}
.et input,.et select{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 6px;width:100%;min-width:96px;font-size:12.5px}
.et input.w-s{min-width:64px}
.bapt select{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 6px}

/* docs */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3vw,36px);min-width:0}
.doc-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;border-bottom:2px solid var(--fg);padding-bottom:12px;margin-bottom:18px}
.doc-h h2{font-size:28px}
.doc-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:grid;grid-template-columns:auto auto;gap:0 12px}
.part{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
.doc h3{font-size:19px;margin:8px 0 8px;display:flex;gap:10px;align-items:baseline}
.part + h3{margin-top:4px}
.doc h3:not(.part + h3){margin-top:26px}
.doc h3 .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400}
.doc p,.doc li{max-width:85ch}
.doc ul{padding-left:20px;margin:6px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px}
.diagram svg{display:block;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;border:1.5px solid;display:inline-block}
.ln{width:22px;height:0;border-top:2px solid;display:inline-block}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.met,.pill.doc{background:var(--ok-soft);color:var(--ok)} .pill.partial{background:var(--warn-soft);color:var(--warn)}
.pill.gap{background:var(--crit-soft);color:var(--crit)} .pill.open,.pill.na{background:var(--sunk);color:var(--muted)}
.pri{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.pri.High{border-color:var(--fg);font-weight:600}
.sev{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 6px;border-radius:3px;border:1px solid}
.sev.C{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)} .sev.H{color:var(--warn);border-color:var(--warn)}
.sev.M{color:var(--accent);border-color:var(--accent)} .sev.L{color:var(--muted);border-color:var(--line)}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cfg .card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cfg .card h4{margin:0 0 2px}
.cfg .card .prod{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cfg .card ul{font-size:13px}
.bad{color:var(--crit);font-weight:500}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty.big{padding:48px 20px;background:var(--panel)}
.empty.big h2{color:var(--fg);font-size:22px;margin-bottom:6px}

/* SABSA matrix */
.sx th:first-child,.sx td:first-child{white-space:nowrap}
.sx td{min-width:132px;font-size:12px}
.sx td b{display:block;font-size:12.5px;font-weight:600}
.sx td.c-met,.sx td.c-doc{background:var(--ok-soft)} .sx td.c-partial{background:var(--warn-soft)} .sx td.c-gap{background:var(--crit-soft)}
.sx td .m{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* gaps */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted)}
.tile.C .v{color:var(--crit)} .tile.H .v{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chipf{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.chipf[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gap-row td:nth-child(3),.gap-row td:nth-child(4){min-width:250px}
.gap-row input{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 6px;width:120px}
.fw{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
details.fold{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.fold>summary{cursor:pointer;padding:12px 16px;font-family:var(--f-display);font-weight:600;font-size:16px}
details.fold>div{padding:0 16px 16px}
.dom h3{font-size:16px;margin:14px 0 8px;display:flex;gap:10px;align-items:baseline}
.dom h3 .n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details.items summary{cursor:pointer;color:var(--accent);font-size:12.5px}
details.items ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
.fwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:12px 0}
.fwcard{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.fwcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.fwcard b{font-family:var(--f-mono)}
.fwcard p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
tr.cur td{background:var(--accent-soft)}

.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ex textarea{width:100%;min-height:300px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:10px;resize:vertical}
.ex .tile{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:var(--r);font-size:13px;z-index:50;max-width:90vw}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* review */
.pill.sub{background:var(--accent-soft);color:var(--accent)}
.pf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pf-head h2{font-size:24px}
.steps{list-style:none;counter-reset:st;display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 8px}
.steps li{counter-increment:st;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;color:var(--muted);max-width:none}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.steps li.ok{color:var(--fg);border-color:var(--ok)}
.steps li.ok::before{content:"✓";background:var(--ok);color:var(--panel)}
.lbl{display:block;font-weight:500;margin:12px 0 4px}
.ta{display:block;width:100%;max-width:85ch;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;resize:vertical}
.decision{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 14px;max-width:85ch}
.decision p{margin:8px 0 0;white-space:pre-wrap}
.rvbox{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:16px clamp(16px,3vw,36px);margin-top:16px;min-width:0}
.rvbox h3{font-size:17px;margin-bottom:8px}
.cms{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.doc .cms{padding-left:0}
.cm{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;max-width:85ch}
.cm.done{opacity:.65}
.cm-h{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap}
.cm p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.rvadd{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-width:85ch}
select:disabled{opacity:.7}
.disclaimer{font-size:12px;color:var(--muted);margin-top:24px;max-width:90ch}

svg text{font-family:var(--f-body);fill:var(--fg)}
svg .band{fill:var(--panel);stroke:var(--line)}
svg .collab{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);letter-spacing:.06em}
svg .zone{fill:var(--panel);stroke:var(--fg);stroke-width:1.2}
svg .zonelab{font-family:var(--f-display);font-weight:600;font-size:13px}
svg .actor{fill:var(--sunk);stroke:var(--line)}
svg .xsys{fill:var(--panel);stroke:var(--muted);stroke-dasharray:4 3}
svg .comp{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
svg .comp.badc{stroke:var(--crit);fill:var(--crit-soft);stroke-width:2}
svg .chip{stroke-width:1.6;fill:var(--panel)}
svg .chip.met{stroke:var(--ok);fill:var(--ok-soft)} svg .chip.partial{stroke:var(--warn);fill:var(--warn-soft)}
svg .chip.gap{stroke:var(--crit);fill:var(--crit-soft);stroke-dasharray:5 3}
svg .chip.open{stroke:var(--na);stroke-dasharray:2 3}
svg .cn{font-size:11.5px;font-weight:600} svg .cp{font-size:10px;fill:var(--muted);font-family:var(--f-mono)}
svg .flow{stroke:var(--muted);stroke-width:1.4;fill:none}
svg .flow.weak{stroke:var(--crit);stroke-width:1.8;stroke-dasharray:6 3}

function threats(){

 const cls=['Secret','Top Secret'].includes(a.dataClass)?1:a.dataClass==='Restricted'?0.5:0;

  mit=mit.filter(m=>m.st!=='na');if(!mit.length)return;

  const st=sts.every(s=>s==='met')?'met':sts.every(s=>s==='open')?'open':sts.some(s=>s==='met'||s==='partial')?'partial':sts.includes('gap')?'gap':'open';
  const sc=(exposed?1:0)+cls+(a.critical==='Yes'?0.5:0)+(concern.includes(tc)?1:0);
  const risk=sc>=2?'High':sc>=1?'Medium':'Low';
  const res=st==='met'?'Low':st==='partial'?({High:'Medium',Medium:'Low',Low:'Low'})[risk]:risk;
  out.push({id:'T-'+String(out.length+1).padStart(2,'0'),el,cat,title,mit,st,risk,res,concern:concern.includes(tc)});
 };
 const fm=ids=>ids.map(id=>FMAP[id]).filter(Boolean).map(f=>({l:f.l,st:statusOf(f),refs:f.c}));
 SYS_THREATS.forEach(([cat,title,ids,tc])=>add('Whole system',cat,title,fm(ids),tc,inet(a)));
 sy.comps.forEach(c=>(TIER_THREATS[c.tier]||TIER_THREATS.Other).forEach(([cat,title,ids,tc])=>add(c.n,cat,title,fm(ids),tc,['DMZ','Internet','SaaS provider'].includes(c.zone))));
 sy.ifs.forEach(f=>{
  if(!f.from||!f.to)return;
  const el=`${f.from} → ${f.to}`,zf=zoneOf(f.from),zt=zoneOf(f.to),cross=zf!==zt,exp=[zf,zt].some(z=>z==='Internet'||z==='External');
  const sens=f.cls&&f.cls!=='Public',weak=WEAK_ENC.includes(f.enc);
  add(el,'I',`Data read or changed in transit${cross?' across the '+zf+' / '+zt+' boundary':''}`,[{l:'Encryption in transit: '+(f.enc||'not stated'),st:!f.enc?'open':weak?(sens?'gap':'partial'):'met',refs:['2-8-3']}],'Data breach or leakage',exp);

 });
 return out;
}

/* Draws the zone diagram to a PNG. An SVG used as an image cannot see the page's stylesheet, so each element's computed style is written onto it first (in the light theme, for a white page). */
function diagramPNG(svgHtml){
 return new Promise(resolve=>{
  const root=document.documentElement,prev=root.getAttribute('data-theme'),host=document.createElement('div');
  host.style.cssText='position:absolute;left:-99999px;top:0';
  let xml='',w=0,h=0;
  try{
   root.setAttribute('data-theme','light');
   host.innerHTML=svgHtml;document.body.appendChild(host);
   const svg=host.querySelector('svg'),vb=svg.getAttribute('viewBox').split(/\s+/).map(Number);
   w=vb[2];h=vb[3];
   svg.querySelectorAll('rect,path,text,tspan').forEach(el=>{
    const cs=getComputedStyle(el);
    ['fill','stroke','stroke-width','stroke-dasharray','opacity','font-size','font-weight','letter-spacing','paint-order','text-anchor'].forEach(p=>{const v=cs.getPropertyValue(p);if(v)el.style.setProperty(p,v)});
    if(el.tagName==='text'||el.tagName==='tspan')el.style.setProperty('font-family','Arial, Helvetica, sans-serif');
   });
   svg.removeAttribute('style');svg.setAttribute('width',w);svg.setAttribute('height',h);
   xml=new XMLSerializer().serializeToString(svg);
  }catch(e){xml=''}
  if(prev===null)root.removeAttribute('data-theme');else root.setAttribute('data-theme',prev);
  host.remove();
  if(!xml)return resolve(null);
  const img=new Image();
  img.onload=()=>{
   try{const k=2,c=document.createElement('canvas');c.width=w*k;c.height=h*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);resolve({url:c.toDataURL('image/png'),w,h})}
   catch(e){resolve(null)}
  };
  img.onerror=()=>resolve(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
 });
}

/* ============================== SHARED STORE ============================== */
/* Where things are kept when a signed-in person opens the page in Claude:
     designs/<owner id>/systems/<system id>   the form, the generated documents and the submitted version. The owner writes; the owner and cybersecurity read.
     designs/<owner id>                       index of that owner's submitted designs, so cybersecurity can list them.
     reviews/<owner id>/systems/<system id>   decision and comments. Cybersecurity writes; that owner reads.
     reviews/<owner id>                       index of decisions, for the review queue.
   "Cybersecurity" is anyone with Editor or Owner access to the page. Everyone else sees only their own designs.
   Without the shared store the page works from this browser alone. */
let CLOUD=null,SYNC='local',IDX=false;
const DIRTY=new Set(),WRITING=new Set();
let REV={},QUEUE=[],RIDX={};
const SYNC_LABEL={local:'Saved in this browser only',connecting:'Connecting…',saved:'Saved',saving:'Saving…',error:'Not saved yet, retrying',failed:'Could not save this design',readonly:'View-only: saved in this browser only'};
function setSync(v){SYNC=v;const e=document.getElementById('sync');if(e)e.textContent=SYNC_LABEL[v]}
const hasWork=s=>Object.keys(s.a).length>0||s.comps.length>0;
const toDoc=s=>clone({a:s.a,comps:s.comps,ifs:s.ifs,plan:s.plan||{},snap:s.snap||null,genAt:s.genAt||null,sub:s.sub||null,rev:s.rev||0});
const fromDoc=(id,d)=>{const s=Object.assign({a:{},comps:[],ifs:[],plan:{}},clone(d),{id,example:false,cloud:true});s.a=s.a||{};s.comps=s.comps||[];s.ifs=s.ifs||[];s.plan=s.plan||{};return fixZones(s)};
function touch(s){
 if(!s||s.example)return;
 s.rev=Date.now();
 if(!CLOUD||CLOUD.readonly)return;
 DIRTY.add(s.id);setSync('saving');clearTimeout(touch.t);touch.t=setTimeout(flush,1200);
}
function saveData(s){touch(s||sys());save()}
function settle(){if(!DIRTY.size&&!WRITING.size&&SYNC==='saving')setSync('saved')}
/* true = worth retrying later */
function storeError(e){
 const code=e&&e.code;
 if(code==='invalid_argument'||code==='transform_error'){
  if(CLOUD.canWrite===true){setSync('failed');return false}
  CLOUD.readonly=true;DIRTY.clear();setSync('readonly');renderShell();return false;
 }
 if(code==='not_granted'||code==='revoked'||code==='capability_disabled'||code==='capability_removed'){CLOUD.readonly=true;DIRTY.clear();setSync('local');return false}
 if(code==='quota_exceeded'){setSync('failed');return false}
 setSync('error');clearTimeout(storeError.t);storeError.t=setTimeout(flush,20000);return true;
}
async function flush(){
 for(const id of [...DIRTY])await pushSystem(id);
 if(IDX)await pushIndex();
}
async function pushSystem(id){
 if(!CLOUD||CLOUD.readonly||WRITING.has(id))return;
 const s=S.systems.find(x=>x.id===id);
 DIRTY.delete(id);
 if(!s||s.example){settle();return}
 WRITING.add(id);setSync('saving');
 let ok=true;
 try{await CLOUD.db.doc('designs/'+CLOUD.uid+'/systems/'+id).set(toDoc(s));s.cloud=true;save()}
 catch(e){ok=false;if(storeError(e))DIRTY.add(id)}
 WRITING.delete(id);
 if(ok&&DIRTY.has(id))return pushSystem(id);
 settle();return ok;
}
async function pushIndex(){
 if(!CLOUD||CLOUD.readonly)return;
 const items={};
 S.systems.forEach(s=>{if(!s.example&&s.sub)items[s.id]={name:s.sub.a.sysName||'',proj:s.sub.a.projName||'',type:s.sub.a.sysType||'',cls:s.sub.a.dataClass||'',version:s.sub.version,at:s.sub.at}});
 try{await CLOUD.db.doc('designs/'+CLOUD.uid).set({items,rev:Date.now()});IDX=false}
 catch(e){IDX=true;storeError(e)}
}
/* My designs changed in the store (this tab, another tab or another device). A copy here that is newer, or still being saved, wins. */
function onMine(qs){
 const sure=!qs.metadata.fromCache,remote={},before=sys(),busy=id=>DIRTY.has(id)||WRITING.has(id),next=[];
 qs.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
 S.systems.forEach(s=>{
  if(s.example){next.push(s);return}
  const r=remote[s.id];delete remote[s.id];
  if(r){
   if(!busy(s.id)&&(r.rev||0)>(s.rev||0))next.push(fromDoc(s.id,r));
   else{s.cloud=true;next.push(s)}
  }
  else if(s.cloud&&sure&&!busy(s.id)){/* deleted from another device: drop it here too */}
  else{next.push(s);if(sure&&!s.cloud&&hasWork(s)&&!busy(s.id))touch(s)}
 });
 Object.keys(remote).forEach(id=>next.push(fromDoc(id,remote[id])));
 if(sure&&CLOUD.first){CLOUD.first=false;if(next.some(s=>!s.example))for(let i=next.length-1;i>=0;i--)if(next[i].example)next.splice(i,1)}
 if(!next.length)next.push(blankSystem());
 S.systems=next;
 const i=next.indexOf(before),j=next.findIndex(s=>s.id===before.id);
 S.cur=i>=0?i:j>=0?j:0;
 save();
 if(CTX)return;
 if(sys()!==before)keep();else renderShell();
}

 REV={};qs.docs.forEach(d=>{if(d.exists)REV[d.id]=clone(d.data())});

function onQueue(qs){
 QUEUE=[];
 qs.docs.forEach(d=>{const it=(d.exists&&d.data().items)||{};Object.keys(it).forEach(id=>QUEUE.push(Object.assign({uid:d.id,id},it[id])))});
 QUEUE.sort((p,q)=>String(q.at).localeCompare(String(p.at)));
 if(UI.tab==='queue'&&!CTX)keep();else renderShell();
}

async function connect(){
 if(!window.claude||typeof window.claude.use!=='function')return;
 setSync('connecting');
 let db=null,user=null,uid=null,reviewer=false,canWrite=null;
 try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
 if(db&&user)try{uid=await user.id();reviewer=await user.canEdit();canWrite=await user.can('data.write')}catch(e){}
 if(!db||!user||!uid){setSync('local');return}
 /* this browser's copy belongs to whoever used it last: never show one person's designs to another */
 if(S.uid&&S.uid!==uid){S.systems=[blankSystem()];S.cur=0}
 S.uid=uid;save();
 CLOUD={db,user,uid,reviewer,canWrite,readonly:canWrite===false&&!reviewer,first:true};
 setSync(CLOUD.readonly?'readonly':'saved');
 db.collection('designs/'+uid+'/systems').onSnapshot(onMine,onStoreGone);

 if(reviewer){
  db.collection('designs').onSnapshot(onQueue,onStoreGone);

 }
 keep();
}

  CTX={uid,id,doc,rev,view:{a:doc.sub.a||{},comps:doc.sub.comps||[],ifs:doc.sub.ifs||[]}};
  UI.tab='hld';render();window.scrollTo(0,0);
 }catch(e){toast('Could not open the design. Try again.')}
}
async function saveReview(msg){
 const rv=CTX.rev,base='reviews/'+CTX.uid;
 try{
  await CLOUD.db.doc(base+'/systems/'+CTX.id).set(clone(rv));
  const item={version:rv.version||0,decision:rv.decision||'',at:rv.at||'',n:rv.comments.filter(c=>!c.done).length};
  const ref=CLOUD.db.doc(base),ex=await ref.get();
  if(ex.exists)await ref.update({items:{[CTX.id]:item}});else await ref.set({items:{[CTX.id]:item}});
  if(msg)toast(msg);
 }catch(e){toast('The review could not be saved. Check your access and try again.')}
 if(CTX)keep();
}
async function submitDesign(){
 const s=sys();
 if(!CLOUD||CLOUD.readonly||s.example||!s.snap||isDirty())return;
 const n=document.getElementById('subNote'),note=n?n.value.trim():'';
 if(n)n.value='';
 s.sub={a:clone(s.snap.a),comps:clone(s.snap.comps),ifs:clone(s.snap.ifs),version:(s.sub?s.sub.version:0)+1,at:new Date().toISOString(),note};
 saveData(s);clearTimeout(touch.t);IDX=true;
 const ok=await pushSystem(s.id);
 if(ok!==false)await pushIndex();
 keep();
 toast(ok===false?'Saved here, but the shared store could not be reached. It will try again.':'Version '+s.sub.version+' submitted to cybersecurity');
}
function removeSystem(i){
 const s=S.systems[i];
 S.systems.splice(i,1);
 if(!S.systems.length)S.systems.push(blankSystem());
 S.cur=Math.min(S.cur,S.systems.length-1);save();
 if(CLOUD&&!CLOUD.readonly&&s&&s.cloud){DIRTY.delete(s.id);CLOUD.db.doc('designs/'+CLOUD.uid+'/systems/'+s.id).delete().then(()=>{if(s.sub)pushIndex()},()=>{})}
}

/* ============================== EVENTS ============================== */
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function setTab(t){UI.tab=t;save();try{history.replaceState(null,'','#'+t)}catch(e){}render();window.scrollTo(0,0)}
/* Re-render in place: keeps the scroll position and anything typed into a draft box */
function keep(){
 const y=window.scrollY,d={};
 document.querySelectorAll('[data-draft]').forEach(e=>{if(e.id&&e.value)d[e.id]=e.value});
 render();
 Object.keys(d).forEach(id=>{const e=document.getElementById(id);if(e)e.value=d[id]});
 window.scrollTo(0,y);
}
function newSystem(){CTX=null;S.systems.push(blankSystem());S.cur=S.systems.length-1;UI.err=false;save();setTab('form');toast('Blank form ready')}
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='frm')generate()});
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a[data-tab]');if(!t)return;const ds=t.dataset;
 if(ds.tab){e.preventDefault();return setTab(ds.tab)}
 if(ds.jump){const el=document.getElementById(ds.jump);if(el)el.scrollIntoView({block:'start'});return}
 if(ds.f&&ds.v){const a=sys().a;a[ds.f]=a[ds.f]===ds.v?'':ds.v;saveData();keep();return}
 if(ds.m){const a=sys().a,arr=Array.isArray(a[ds.m])?a[ds.m]:[];a[ds.m]=arr.includes(ds.v)?arr.filter(x=>x!==ds.v):[...arr,ds.v];saveData();keep();return}
 if(ds.rdel){const[k,i]=ds.rdel.split(':');sys()[k].splice(+i,1);saveData();keep();return}
 if(ds.sev){UI.sev=ds.sev;save();keep();return}
 if(ds.cst){UI.cst=ds.cst;save();keep();return}
 if(ds.lay){UI.lay=ds.lay;save();keep();return}
 if(ds.fwf){UI.fw=ds.fwf;save();keep();return}
 if(ds.tm){UI.tm=ds.tm;save();keep();return}
 if(ds.ts){UI.ts=ds.ts;save();keep();return}
 if(ds.qf){UI.qf=ds.qf;save();keep();return}
 if(ds.rv){const[u,id]=ds.rv.split('|');openSubmission(u,id);return}
 if(ds.addc){
  if(!CTX)return;
  const ta=document.getElementById('ct-'+ds.addc),se=document.getElementById('cs-'+ds.addc),text=ta?ta.value.trim():'';
  if(!text){toast('Write the comment first');return}
  CTX.rev.comments.push({id:uid(),doc:ds.addc,sec:se?se.value.trim():'',text,by:CLOUD.uid,at:new Date().toISOString(),v:CTX.doc.sub.version,done:false});
  ta.value='';if(se)se.value='';
  saveReview('Comment added');return;
 }
 if(ds.cdone||ds.cdel){
  if(!CTX)return;
  const id=ds.cdone||ds.cdel,i=CTX.rev.comments.findIndex(c=>c.id===id);if(i<0)return;
  if(ds.cdel)CTX.rev.comments.splice(i,1);else CTX.rev.comments[i].done=!CTX.rev.comments[i].done;
  saveReview(ds.cdel?'Comment deleted':'');return;
 }
 if(ds.open!==undefined){S.cur=+ds.open;UI.err=false;save();setTab('form');return}
 if(ds.dup!==undefined){const c=clone(S.systems[+ds.dup]);c.id=uid();c.example=false;c.a.sysName=(c.a.sysName||'System')+' (copy)';['snap','genAt','sub','cloud','rev'].forEach(k=>delete c[k]);S.systems.push(c);S.cur=S.systems.length-1;saveData(c);setTab('form');toast('Form duplicated');return}
 if(ds.askdel!==undefined){const i=+ds.askdel;document.getElementById('sa-'+i).innerHTML=`<span class="confirm">Delete? <button class="btn sm danger" data-del="${i}">Delete</button><button class="btn sm" data-act="cancel">Keep</button></span>`;return}
 if(ds.del!==undefined){removeSystem(+ds.del);render();toast('System deleted');return}
 if(ds.copy){const ta=document.getElementById(ds.copy);
  try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied to clipboard'),()=>{ta.select();toast('Press Ctrl+C to copy the selected text')})}catch(err){ta.select();toast('Press Ctrl+C to copy the selected text')}return}
 const act=ds.act;if(!act)return;
 if(act==='newsys')return newSystem();
 if(act==='generate')return generate();
 if(act==='pdf')return exportPdf();
 if(act==='submit')return submitDesign();
 if(act==='closerv'){CTX=null;UI.tab='queue';render();window.scrollTo(0,0);return}
 if(act==='decide'){
  if(!CTX)return;
  const d=document.getElementById('rvDecision').value;
  if(!d){toast('Select a decision first');return}
  Object.assign(CTX.rev,{decision:d,summary:document.getElementById('rvSummary').value.trim(),version:CTX.doc.sub.version,by:CLOUD.uid,at:new Date().toISOString()});
  saveReview('Decision recorded: '+DECISION[d]);return;
 }
 if(act==='addcomp'){sys().comps.push({n:'Component '+(sys().comps.length+1),tier:'Application',tech:'',zone:'Application zone',host:'',port:''});saveData();keep();return}
 if(act==='addif'){const c=sys().comps;sys().ifs.push({from:c[0]?c[0].n:'',to:c[1]?c[1].n:'',proto:'HTTPS',port:'443',cls:sys().a.dataClass||'Restricted',enc:'TLS 1.2',auth:'OAuth2 / OIDC'});saveData();keep();return}
 if(act==='seed'){(TEMPLATES[sys().a.sysType]||[]).forEach(([n,tier,zone])=>{if(!sys().comps.some(c=>lc(c.n)===lc(n)))sys().comps.push({n,tier,tech:'',zone,host:'',port:''})});saveData();keep();toast('Typical components added');return}
 if(act==='cancel'){render();return}
 if(act==='samples'){S.systems.push(...sampleSystems());save();render();toast('Sample system added');return}
 if(act==='load'){loadJSON(document.getElementById('jsonout').value);return}
});
/* Adds the systems in a saved file to the list (one with the same id replaces the copy here) */
function loadJSON(txt){
 try{const o=JSON.parse(txt);const list=Array.isArray(o.systems)?o.systems:(o&&o.a?[o]:null);if(!list||!list.length)throw 0;
  list.forEach(s=>{s.id=s.id||uid();s.a=s.a||{};s.comps=s.comps||[];s.ifs=s.ifs||[];s.plan=s.plan||{};delete s.cloud;fixZones(s)});
  const ids=new Set(list.map(s=>s.id)),kept=S.systems.filter(s=>!ids.has(s.id));
  S.systems=[...kept,...list];S.cur=kept.length;
  list.forEach(s=>touch(s));save();render();toast(list.length+' system(s) loaded')}
 catch(e){toast('That text is not a saved form. Paste the JSON copied from this page.')}
}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='sysSel'){S.cur=+t.value;UI.err=false;save();t.blur();render();return}
 if(t.id==='file'&&t.files[0]){const r=new FileReader();r.onload=()=>loadJSON(r.result);r.readAsText(t.files[0]);return}
 if(t.tagName==='SELECT'&&t.dataset.f){sys().a[t.dataset.f]=t.value;saveData();keep();return}
 if(t.dataset.ct&&t.tagName==='SELECT'){sys()[t.dataset.ct][+t.dataset.i][t.dataset.k]=t.value;saveData();return}
});
/* Typing never re-renders the form (a re-render on blur would swallow the click that caused the blur); only names and row state are patched in place. */
function refreshNames(){
 const o=document.getElementById('sysSel').options[S.cur];if(o)o.textContent=sys().a.sysName||'Untitled system';
 document.getElementById('endpoints').innerHTML=[...ACTORS,...sys().comps.map(c=>c.n)].filter(Boolean).map(n=>`<option value="${esc(n)}"></option>`).join('');
}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.tagName==='INPUT'&&t.dataset.f){sys().a[t.dataset.f]=t.value;saveData();
  if(t.dataset.f==='sysName')refreshNames();
  const f=FMAP[t.dataset.f],row=f&&document.getElementById('row-'+f.id);if(row&&f.c)row.className='q st-'+statusOf(f);
  return}
 if(t.tagName==='INPUT'&&t.dataset.ct){sys()[t.dataset.ct][+t.dataset.i][t.dataset.k]=t.value;saveData();if(t.dataset.k==='n')refreshNames();return}
 if(t.dataset.plan&&!CTX){const p=sys().plan[t.dataset.plan]=sys().plan[t.dataset.plan]||{};p[t.dataset.k]=t.value;saveData();return}
});
render();
connect();
</script>
